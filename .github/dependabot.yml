version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: ci

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: chore
    labels: ["auto-merge"]
    groups:
      nix:
        patterns: ["*"]
